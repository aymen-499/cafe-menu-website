<!DOCTYPE html>
<html>
<head>
    <title>Cafe Menu - About & Contact</title>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html" class="active">About & Contact</a>
    </nav>

    <div class="container">
        <h1>About Our Cafe</h1>
        <p>We serve fresh tea, coffee, biryani, and pizza in a cozy environment.</p>

        <h2>Contact Us</h2>
        <p>Location: Main Market, Islamabad | Phone: 0300-1234567</p>

        <form onsubmit="alert('Thank you for contacting us!'); return false;">
            <label for="name">Your Name:</label>
            <input type="text" id="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" required>

            <label for="message">Message:</label>
            <textarea id="message" rows="4" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <footer>
        <p>Cafe Menu Website | Open Daily: 9:00 AM - 11:00 PM</p>
    </footer>

</body>
